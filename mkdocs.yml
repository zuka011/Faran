site_name: Faran
site_url: https://risk-metrics.gitlab.io/faran/
site_description: A library providing performant NumPy & JAX implementations of an MPPI planner
site_author: Zurab Mujirishvili
repo_url: https://gitlab.com/risk-metrics/faran
repo_name: risk-metrics/faran

# Exclude unused visualization files from build
exclude_docs: |
  visualizations/**/*.json

theme:
  name: material
  icon:
    repo: material/gitlab
  custom_dir: docs/overrides
  logo: assets/logo-alt.svg
  favicon: assets/logo-alt.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - header.autohide
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

plugins:
  - search
  - bibtex:
      bib_file: "docs/references.bib"
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 2
            show_signature_annotations: true
            separate_signature: true
            line_length: 80
            filters:
              - "!^_"
              - "!^__(?!init__|call__|getitem__|setitem__|len__|iter__).*__$"
            show_if_no_docstring: false
            merge_init_into_class: true
            show_docstring_attributes: true
            show_docstring_functions: true
            show_docstring_classes: true
            show_docstring_modules: true
            show_docstring_description: true
            show_docstring_examples: true
            show_docstring_other_parameters: true
            show_docstring_parameters: true
            show_docstring_raises: true
            show_docstring_receives: true
            show_docstring_returns: true
            show_docstring_warns: true
            show_docstring_yields: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true

extra:
  status:
    draft: Draft

extra_javascript:
  - javascripts/katex.js
  - javascripts/lazy-iframes.js
  - javascripts/reading-time.js
  - javascripts/draft-banner.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - stylesheets/palette.css
  - stylesheets/layout.css
  - stylesheets/components.css
  - https://unpkg.com/katex@0/dist/katex.min.css

nav:
  - Home: index.md
  - User Guide:
      - Getting Started: guide/getting-started.md
      - Features: guide/features.md
      - Concepts:
          - guide/concepts/index.md
          - Planning: guide/concepts/planning.md
          - MPC: guide/concepts/mpc.md
          - MPCC: guide/concepts/mpcc.md
          - Computational Framework: guide/concepts/framework.md
          - Composability: guide/concepts/composability.md
          - Conventions: guide/concepts/conventions.md
          - Gotchas: guide/concepts/gotchas.md
      - Backends: guide/backends.md
      - Visualizer: guide/visualizer.md
      - Examples:
          - guide/examples/index.md
          - Boundaries: guide/examples/path-following-with-boundaries.md
          - Obstacle Avoidance: guide/examples/obstacle-avoidance.md
          - Uncertainty: guide/examples/obstacle-avoidance-with-uncertainty.md
  - API Reference:
      - api/index.md
      - Planners:
          - MPPI:
              - api/mppi/index.md
              - Planner Factories: api/mppi/planner.md
              - Filters: api/mppi/filter.md
      - Models:
          - api/model/index.md
          - Kinematic Bicycle: api/model/bicycle.md
          - Unicycle: api/model/unicycle.md
          - Single Integrator: api/model/integrator.md
      - Estimation:
          - api/estimation/index.md
          - Finite Difference: api/estimation/finite-difference.md
          - Kalman Filter: api/estimation/kalman.md
          - Extended Kalman Filter: api/estimation/ekf.md
          - Unscented Kalman Filter: api/estimation/ukf.md
          - Noise Covariance: api/estimation/noise.md
      - Samplers:
          - api/sampler/index.md
          - Gaussian: api/sampler/gaussian.md
          - Halton Spline: api/sampler/halton.md
      - Costs:
          - api/costs/index.md
          - Tracking: api/costs/tracking.md
          - Safety: api/costs/safety.md
          - Risk Metrics: api/costs/risk.md
          - Comfort: api/costs/comfort.md
      - Trajectories:
          - api/trajectory/index.md
          - Waypoints: api/trajectory/waypoints.md
          - Line: api/trajectory/line.md
      - Boundaries:
          - api/boundary/index.md
          - Corridors: api/boundary/corridors.md
      - Obstacles:
          - api/obstacles/index.md
          - Observers: api/obstacles/observer.md
          - Simulators: api/obstacles/simulator.md
      - Predictors:
          - api/predictor/index.md
      - Collectors:
          - api/collectors/index.md
          - Registry: api/collectors/registry.md
      - Metrics:
          - api/metrics/index.md
          - Available Metrics: api/metrics/available.md
      - Types:
          - api/types/index.md
      - Visualizer:
          - api/visualizer/index.md
